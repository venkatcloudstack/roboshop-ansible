- name: roboshop instances management 
  hosts: local
  connection: local
  vars: 
    instances: ["mongodb" , "redis",]
    image_id: "ami-0055977a6e828a4f4"
    domain_name: "venkatcloudstack.shop"
    action: create
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      security_groups:
        - "roboshop-{{ item }}"
        - roboshop-common
    loop: "{{ instances }}"
    register: ec2_output
    when: action == "create"

  # - name: print the output
  #   debug:
  #     msg: "{{ ec2_output  }}"

  # - name: create r53 record
  #   debug:
  #     msg:  "instance name : {{ item.item }} private ip : {{ item.instances[0].private_ip_address }}"
  #   loop: "{{ ec2_output.results }}"

  - name: create r53 records
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item  }}.{{ domain_name  }}"
      type: A
      ttl: 1
      overwrite: true
      value: "{{ item.instances[0].private_ip_address }}"
    loop: "{{ ec2_output.results }}"
    when: action == "create"
    
  - name: create r53 records for "frontend"
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name  }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when:
    - item.item == "frontend""
    - action == "create""

  - name: delete r53 records
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      ttl: 1
      type: A
      record: "{{ item }}.{{ domain_name }}"
    loop: "{{ instances }}"
    when: action == "delete"

  - name: delete r53 records for frontend
    amazon.aws.route53:
      state: absent
      zone: {{ domain_name }}
      ttl: 1
      type: A
      record: "{{ domain_name }}"
    loop: "{{ instances }}"
    when: 
    - action == "delete"
    - item == "frontend"

  - name: delete ec2 instances
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{ item }}"
      wait: false
    loop: "{{ instances }}"
    when: action == "delete"





