- name: roboshop instances management 
  hosts: local
  connection: local
  vars: 
    instances: [ "mongodb" , "redis" ]
    image_id: "ami-0055977a6e828a4f4"
  tasks:
  - name: create ec2 instances
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      image_id: "{{ image_id }}"
      security_groups:
        - roboshop-"{{ item }}"
        - roboshop-common
    loop: "{{ instances }}"
    register: ec2_output

  - name: print the output
    debug:
      msg: "{{ ec2_output  }}"


